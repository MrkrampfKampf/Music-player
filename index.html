<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Resonate</title>
<meta name="description" content="An offline music and video player for your own files.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resonate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
</head>
<body>

<div id="app" class="app">

  <!-- Scrolling content. One view is visible at a time. -->
  <main id="main" class="main">

    <section class="view" data-view="home" hidden>
      <header class="view-head">
        <h1 id="greeting">Listen Now</h1>
        <button class="icon-btn" data-action="open-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear"/></svg>
        </button>
      </header>
      <div id="home-body"></div>
    </section>

    <section class="view" data-view="library" hidden>
      <header class="view-head">
        <button class="room-back" data-back aria-label="Back to the room">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-room"/></svg>
        </button>
        <h1>Library</h1>
        <button class="icon-btn" data-action="import" aria-label="Add music">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
      </header>
      <nav class="segmented" id="library-tabs" role="tablist">
        <button role="tab" data-tab="playlists">Playlists</button>
        <button role="tab" data-tab="songs" aria-selected="true">Songs</button>
        <button role="tab" data-tab="albums">Albums</button>
        <button role="tab" data-tab="artists">Artists</button>
        <button role="tab" data-tab="genres">Genres</button>
        <button role="tab" data-tab="videos">Videos</button>
      </nav>
      <div id="library-body"></div>
    </section>

    <section class="view" data-view="search" hidden>
      <header class="view-head">
        <button class="room-back" data-back aria-label="Back to the room">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-room"/></svg>
        </button>
        <h1>Search</h1>
      </header>
      <nav class="segmented" id="search-tabs" role="tablist">
        <button role="tab" data-scope="library" aria-selected="true">My Library</button>
        <button role="tab" data-scope="online">Find Online</button>
      </nav>
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Songs, albums, artists" autocomplete="off"
               autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clear-btn" id="search-clear" hidden aria-label="Clear search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
      <div id="search-body"></div>
    </section>

    <section class="view" data-view="add" hidden>
      <header class="view-head">
        <button class="room-back" data-back aria-label="Back to the room">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-room"/></svg>
        </button>
        <h1>Add Music</h1>
      </header>
      <div id="add-body"></div>
    </section>

    <section class="view" data-view="settings" hidden>
      <header class="view-head">
        <button class="room-back" data-back aria-label="Back to the room">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-room"/></svg>
        </button>
        <h1>Settings</h1>
      </header>
      <div id="settings-body"></div>
    </section>

    <!-- Pushed by the router for albums, artists, playlists and genres. -->
    <section class="view detail" data-view="detail" hidden>
      <div id="detail-body"></div>
    </section>

  </main>

  <!-- Mini player, sits directly above the tab bar. -->
  <button id="mini" class="mini" hidden aria-label="Open the player">
    <span class="mini-art"><img id="mini-img" alt=""></span>
    <span class="mini-text">
      <span class="mini-title" id="mini-title">Nothing playing</span>
      <span class="mini-sub" id="mini-sub"></span>
    </span>
    <span class="mini-actions">
      <span class="icon-btn" id="mini-play" role="button" tabindex="0" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg>
      </span>
      <span class="icon-btn" id="mini-next" role="button" tabindex="0" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-next"/></svg>
      </span>
    </span>
    <span class="mini-progress"><i id="mini-bar"></i></span>
  </button>

  <!-- Full screen player. -->
  <section id="np" class="np" hidden aria-label="Now playing">
    <div class="np-bg" id="np-bg"></div>
    <div class="np-scrim"></div>

    <div class="np-inner">
      <button class="np-grabber" id="np-close" aria-label="Close the player"></button>

      <!-- The deck. The record turning is the play state, the tonearm's angle
           is the position in the track, and dragging the arm seeks. -->
      <div class="np-stage" id="np-stage">
        <div class="deck" id="deck">
          <div class="platter">
            <div class="platter-spin" id="platter-spin">
              <div class="label" id="np-art"><img id="np-img" alt=""></div>
            </div>
            <div class="strobe" id="strobe" aria-hidden="true"></div>
            <div class="spindle" aria-hidden="true"></div>
          </div>

          <!-- Pivot at 90%/16% of this box, which the CSS places just off the
               platter's upper right. The arm is drawn along 134.5 degrees and
               is 94.9 units long, so the stylus lands exactly on the groove
               band when the box is rotated between the two angles in
               nowplaying.js. -->
          <div class="tonearm" id="tonearm" role="slider" tabindex="0"
               aria-label="Position in the track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <!-- counterweight, behind the pivot -->
              <rect x="110" y="2" width="16" height="12" rx="1" fill="#33291e" stroke="#0a0806" stroke-width="0.7"/>
              <rect x="112" y="4.5" width="12" height="2" fill="#0a0806" opacity="0.5"/>

              <!-- the arm, a dark core with a brushed highlight over it -->
              <path d="M104.4 24 L41.5 86.9" stroke="#0a0806" stroke-width="7" stroke-linecap="round"/>
              <path d="M104.4 24 L41.5 86.9" stroke="url(#armG)" stroke-width="4.4" stroke-linecap="round"/>
              <path d="M104.4 24 L41.5 86.9" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.22"/>

              <!-- pivot housing -->
              <circle cx="108" cy="19.2" r="12" fill="#2b241c" stroke="#0a0806" stroke-width="1"/>
              <circle cx="108" cy="19.2" r="6.5" fill="url(#brassG)"/>
              <circle cx="108" cy="19.2" r="2" fill="#0a0806" opacity="0.45"/>

              <!-- headshell, square to the arm -->
              <g transform="rotate(134.5 41.5 86.9)">
                <rect x="34" y="80" width="22" height="14" rx="1.5" fill="#241e18" stroke="#0a0806" stroke-width="0.8"/>
                <rect x="36.5" y="82.5" width="17" height="3" fill="#0a0806" opacity="0.55"/>
              </g>

              <!-- the stylus, touching the groove -->
              <circle cx="41.5" cy="86.9" r="2.6" fill="#d4a04a"/>
              <circle cx="41.5" cy="86.9" r="1" fill="#fff" opacity="0.7"/>

              <defs>
                <linearGradient id="armG" x1="1" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#d8cdb4"/>
                  <stop offset="0.45" stop-color="#8f846c"/>
                  <stop offset="1" stop-color="#524839"/>
                </linearGradient>
                <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#f4dfae"/>
                  <stop offset="1" stop-color="#8a6a22"/>
                </linearGradient>
              </defs>
            </svg>
          </div>

          <span class="arm-hint silk">Drag the arm to move</span>
        </div>

        <video id="np-video" playsinline hidden></video>
        <div class="np-lyrics" id="np-lyrics" hidden></div>
      </div>

      <div class="np-meta">
        <div class="np-titles">
          <div class="np-title" id="np-title">Nothing playing</div>
          <div class="np-sub" id="np-sub"></div>
        </div>
        <button class="icon-btn like" id="np-like" aria-label="Like this song">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"/></svg>
        </button>
      </div>

      <!-- The deck counter. No bar: the arm already shows the position. -->
      <div class="np-counter">
        <span class="num big" id="np-elapsed">0:00</span>
        <span class="silk" id="np-side">Side A</span>
        <span class="num" id="np-remain">-0:00</span>
      </div>
      <input id="np-seek" type="range" min="0" max="1000" value="0" step="1"
             aria-label="Seek" hidden>

      <div class="np-controls">
        <button class="icon-btn" id="np-shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shuffle"/></svg>
        </button>
        <button class="icon-btn big" id="np-prev" aria-label="Previous track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-prev"/></svg>
        </button>

        <!-- Cue lever: throw it across to drop the stylus. -->
        <button class="cue" id="np-play" aria-label="Play">
          <span class="cue-track"></span>
          <span class="cue-knob">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg>
          </span>
          <span class="cue-label"><span>CUE</span><span>PLAY</span></span>
        </button>

        <button class="icon-btn big" id="np-next" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-next"/></svg>
        </button>
        <button class="icon-btn" id="np-repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-repeat"/></svg>
        </button>
      </div>

      <div class="np-volume" id="np-volume">
        <input id="np-vol" type="range" min="0" max="100" value="100" aria-label="Volume">
      </div>

      <div class="np-tools">
        <button class="tool" id="np-lyrics-btn" aria-label="Lyrics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lyrics"/></svg><span>Words</span>
        </button>
        <button class="tool" id="np-airplay-btn" aria-label="AirPlay">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-airplay"/></svg><span>Out</span>
        </button>
        <button class="tool" id="np-speed-btn" aria-label="Playback speed">
          <span class="speeds">
            <span class="speed-pip" id="np-speed-label">33</span>
          </span>
          <span>Speed</span>
        </button>
        <button class="tool" id="np-queue-btn" aria-label="Up next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-queue"/></svg><span>Stack</span>
        </button>
      </div>
    </div>

    <!-- Up Next, slides over the player. -->
    <div class="queue-sheet" id="queue-sheet" hidden>
      <header>
        <h2>Up Next</h2>
        <div>
          <button class="text-btn" id="queue-clear">Clear</button>
          <button class="icon-btn" id="queue-close" aria-label="Close queue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>
      </header>
      <ol id="queue-list"></ol>
    </div>
  </section>

  <!-- Generic bottom sheet for menus and forms. -->
  <div id="sheet-host" class="sheet-host" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Deliberately unfiltered. An accept list greys out anything iOS has no
       type for, which on a phone means FLAC and Opus files you own cannot be
       tapped at all. Everything is selectable and the import filters after. -->
  <input id="file-input" type="file" multiple hidden>
  <input id="art-input" type="file" accept="image/*" hidden>
  <input id="lrc-input" type="file" accept=".lrc,.txt,text/plain" hidden>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>
</div>

  <g id="i-eq"><path d="M5 3h2v6H5zm0 8h2v10H5zM11 3h2v12h-2zm0 14h2v4h-2zM17 3h2v4h-2zm0 6h2v12h-2z" fill="currentColor"/><path d="M3 9h6v2H3zm6 6h6v2H9zM15 7h6v2h-6z" fill="currentColor"/></g>

  <g id="i-folder"><path d="M3 5h6l2 2h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1" fill="currentColor"/></g>
</defs></svg>

<script type="module" src="js/main.js"></script>
</body>
</html>
